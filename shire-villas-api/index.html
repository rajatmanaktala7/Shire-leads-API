<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shire Villas - Secure Lead Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{--forest:#1b3a2b;--gold:#c9a24b;--cream:#f6f1e7;--hot:#d9534f;--warm:#e0a03c;--cold:#4a7fb5}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:#0f251a}
header{background:var(--forest);color:white;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
.actions{display:flex;gap:8px}
button{border:0;border-radius:6px;padding:9px 13px;cursor:pointer}
.primary{background:var(--gold);color:#0f251a;font-weight:700}
.secondary{background:rgba(255,255,255,.15);color:white}
.container{max-width:1200px;margin:auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;padding:16px;border-radius:10px;border-left:4px solid var(--gold)}
.stat .v{font-size:27px;font-weight:700}.stat .l{font-size:11px;color:#666;text-transform:uppercase}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}
.badge{padding:3px 8px;border-radius:999px;color:white;font-size:11px}.HOT{background:var(--hot)}.WARM{background:var(--warm)}.COLD{background:var(--cold)}.UNQUALIFIED{background:#888}
#login{position:fixed;inset:0;background:#0f251a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.loginbox{background:white;width:100%;max-width:420px;border-radius:14px;padding:25px}
.loginbox input{width:100%;padding:12px;margin:12px 0;border:1px solid #ccc;border-radius:7px}
.err{color:#b00020;font-size:13px}
.small{font-size:12px;color:#666}
</style>
</head>
<body>

<div id="login">
  <div class="loginbox">
    <h2>Shire Villas Team Access</h2>
    <p>Enter your Team API Key to open the internal dashboard.</p>
    <input id="teamKeyInput" type="password" placeholder="Team API Key">
    <button class="primary" onclick="login()">Open Dashboard</button>
    <div class="err" id="loginError"></div>
    <p class="small">The key is stored only in this browser session.</p>
  </div>
</div>

<header>
  <div><h1>Shire Villas - Lead Dashboard</h1><div style="font-size:12px;opacity:.75">Secure Team View</div></div>
  <div class="actions">
    <button class="secondary" onclick="logout()">Log out</button>
    <button class="primary" onclick="loadAll()">Refresh</button>
  </div>
</header>

<div class="container">
  <div class="stats" id="stats"></div>
  <div class="card">
    <h3>Qualified CRM Leads</h3>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Score</th><th>Temp</th><th>Status</th><th>Source</th><th>Created</th></tr></thead>
        <tbody id="leads"></tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <h3>Recent Activity</h3>
    <div id="activity"></div>
  </div>
</div>

<script>
const API_BASE=window.location.origin;
let TEAM_KEY=sessionStorage.getItem('shireTeamApiKey') || '';

function authHeaders(){
  return {'X-Team-Key':TEAM_KEY};
}

async function api(path){
  const res=await fetch(API_BASE+path,{headers:authHeaders()});
  if(res.status===401) throw new Error('UNAUTHORIZED');
  if(!res.ok) throw new Error('Request failed');
  return res.json();
}

async function login(){
  TEAM_KEY=document.getElementById('teamKeyInput').value.trim();
  if(!TEAM_KEY)return;
  try{
    await api('/dashboard/');
    sessionStorage.setItem('shireTeamApiKey',TEAM_KEY);
    document.getElementById('login').style.display='none';
    document.getElementById('loginError').textContent='';
    await loadAll();
  }catch(e){
    TEAM_KEY='';
    document.getElementById('loginError').textContent='Invalid Team API Key.';
  }
}

function logout(){
  sessionStorage.removeItem('shireTeamApiKey');
  TEAM_KEY='';
  location.reload();
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

async function loadAll(){
  if(!TEAM_KEY){
    document.getElementById('login').style.display='flex';
    return;
  }

  try{
    const [d, leads]=await Promise.all([
      api('/dashboard/'),
      api('/leads/?limit=200')
    ]);

    const cards=[
      ['Website Visits',d.website_visits],
      ['Real Leads',d.total_leads],
      ['Hot',d.hot],
      ['Warm',d.warm],
      ['Cold',d.cold],
      ['Converted',d.converted],
      ['Conversion Rate',d.conversion_rate+'%'],
      ['Last 7 Days',d.leads_last_7_days]
    ];

    document.getElementById('stats').innerHTML=cards.map(
      ([l,v])=>`<div class="stat"><div class="v">${escapeHtml(v)}</div><div class="l">${escapeHtml(l)}</div></div>`
    ).join('');

    document.getElementById('leads').innerHTML=leads.map(l=>`
      <tr>
        <td>${escapeHtml(l.name)}</td>
        <td>${escapeHtml(l.phone || '-')}</td>
        <td>${escapeHtml(l.email || '-')}</td>
        <td>${escapeHtml(l.overall_score)}</td>
        <td><span class="badge ${escapeHtml(l.temperature)}">${escapeHtml(l.temperature)}</span></td>
        <td>${escapeHtml(l.status)}</td>
        <td>${escapeHtml(l.source)}</td>
        <td>${new Date(l.created_at).toLocaleDateString()}</td>
      </tr>`).join('');

    document.getElementById('activity').innerHTML=(d.recent_activities || []).map(a=>`
      <div style="padding:8px 0;border-bottom:1px solid #eee">
        <strong>${escapeHtml(a.action_type)}</strong> - ${escapeHtml(a.description || '')}
        <div class="small">${new Date(a.created_at).toLocaleString()}</div>
      </div>`).join('') || '<div class="small">No activity yet.</div>';

    document.getElementById('login').style.display='none';
  }catch(e){
    if(e.message==='UNAUTHORIZED')logout();
    else console.error(e);
  }
}

if(TEAM_KEY) loadAll();
</script>
</body>
</html>
