<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Introduce Someone to Shire Villas</title><style>body{font-family:Arial;background:#0b1d15;color:#f2ecdd;margin:0}.box{max-width:650px;margin:50px auto;background:#112b20;padding:28px;border-radius:16px}input,textarea{width:100%;padding:11px;margin:7px 0;border-radius:8px;border:1px solid #365c49;background:#081811;color:white;box-sizing:border-box}button{background:#c8a45a;border:0;padding:12px 18px;border-radius:8px;font-weight:700}label{font-size:13px;color:#c7d2cb}</style></head><body><div class="box"><h1>Introduce Someone to Shire Villas</h1><p>Submit a referral only when the prospect has agreed to be contacted.</p><input id="rn" placeholder="Your name"><input id="rp" placeholder="Your phone"><input id="re" placeholder="Your email"><hr style="border-color:#234435"><input id="pn" placeholder="Prospect name"><input id="pp" placeholder="Prospect phone"><input id="pe" placeholder="Prospect email"><textarea id="notes" placeholder="Notes"></textarea><label><input id="consent" type="checkbox" style="width:auto"> I confirm the prospect has agreed to be contacted.</label><br><br><button onclick="send()">Submit Referral</button><p id="msg"></p></div><script>async function send(){const body={referrer_name:rn.value,referrer_phone:rp.value||null,referrer_email:re.value||null,prospect_name:pn.value,prospect_phone:pp.value||null,prospect_email:pe.value||null,consent_confirmed:consent.checked,notes:notes.value||null};const r=await fetch('/referrals/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok?'Thank you. Referral received.':(d.detail||'Could not submit.')}}</script></body></html>
