<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shire Villas — Control Center</title>
<style>
  :root {
    --forest: #1b3a2b;
    --canopy: #0f251a;
    --gold: #c9a24b;
    --cream: #f6f1e7;
    --ok: #4a8f5c;
    --bad: #c0524d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--cream);
    color: var(--canopy);
  }
  header {
    background: var(--forest);
    color: var(--cream);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }
  .status {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; background: rgba(255,255,255,0.08);
    padding: 6px 12px; border-radius: 20px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #888; }
  .dot.up { background: var(--ok); }
  .dot.down { background: var(--bad); }

  .quicklinks {
    display: flex; gap: 10px; padding: 14px 24px; background: white;
    border-bottom: 1px solid #e5ddca; flex-wrap: wrap;
  }
  .quicklinks a {
    font-size: 12px; color: var(--forest); text-decoration: none;
    padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px;
  }
  .quicklinks a:hover { border-color: var(--gold); }

  nav {
    display: flex; gap: 4px; padding: 0 24px; background: white;
    border-bottom: 2px solid #e5ddca; overflow-x: auto;
  }
  nav button {
    background: none; border: none; padding: 12px 18px; font-size: 14px;
    cursor: pointer; color: #777; border-bottom: 2px solid transparent;
    margin-bottom: -2px; white-space: nowrap;
  }
  nav button.active { color: var(--forest); border-bottom-color: var(--gold); font-weight: 600; }

  .panel { display: none; height: calc(100vh - 130px); }
  .panel.active { display: block; }
  .panel iframe { width: 100%; height: 100%; border: none; }

  .copy-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 24px;
    background: #faf8f2; font-size: 12px; color: #666;
  }
  .copy-row input {
    flex: 1; max-width: 480px; border: 1px solid #ddd; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; background: white; color: #444;
  }
  .copy-row button {
    background: var(--forest); color: white; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Shire Villas — Control Center</h1>
    <div class="sub">Siolim, North Goa · Everything in one place</div>
  </div>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>
</header>

<div class="copy-row">
  Share this link with prospects to start qualifying them:
  <input id="chatbotLink" readonly>
  <button onclick="copyLink()">Copy</button>
</div>

<div class="quicklinks">
  <a href="/app/" target="_blank">Open dashboard in new tab</a>
  <a href="/app/chatbot.html" target="_blank">Open QBot in new tab</a>
  <a href="/docs" target="_blank">Open API docs in new tab</a>
  <a href="/health" target="_blank">Health check</a>
</div>

<nav>
  <button class="active" onclick="showTab('dashboard', this)">Dashboard</button>
  <button onclick="showTab('chatbot', this)">QBot chatbot</button>
  <button onclick="showTab('docs', this)">API docs</button>
</nav>

<div class="panel active" id="panel-dashboard">
  <iframe src="/app/" title="Lead dashboard"></iframe>
</div>
<div class="panel" id="panel-chatbot">
  <iframe src="/app/chatbot.html" title="QBot qualification chatbot"></iframe>
</div>
<div class="panel" id="panel-docs">
  <iframe src="/docs" title="API documentation"></iframe>
</div>

<script>
  const origin = window.location.origin;
  document.getElementById('chatbotLink').value = origin + '/app/chatbot.html';

  function copyLink() {
    const input = document.getElementById('chatbotLink');
    input.select();
    navigator.clipboard.writeText(input.value);
  }

  function showTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
  }

  async function checkHealth() {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    try {
      const res = await fetch(origin + '/health');
      if (res.ok) {
        dot.className = 'dot up';
        text.textContent = 'API online';
      } else {
        throw new Error();
      }
    } catch {
      dot.className = 'dot down';
      text.textContent = 'API offline';
    }
  }
  checkHealth();
  setInterval(checkHealth, 20000);
</script>

</body>
</html>
