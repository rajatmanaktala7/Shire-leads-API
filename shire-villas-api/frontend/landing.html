<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shire Villas</title><meta name="description" content="Shire Villas, Siolim, North Goa">
<style>
:root{--ink:#102019;--forest:#17382b;--gold:#c7a35b;--cream:#f4f0e7;--muted:#7c837e}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--cream)}
.hero{min-height:92vh;display:grid;place-items:center;position:relative;overflow:hidden;background:#102019;color:white}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,24,18,.92),rgba(8,24,18,.48),rgba(8,24,18,.72)),var(--hero) center/cover no-repeat}.heroInner{position:relative;z-index:2;max-width:1180px;width:100%;padding:70px 32px}.eyebrow{color:var(--gold);letter-spacing:3px;font-size:12px}.hero h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,88px);line-height:1.02;max-width:850px;margin:18px 0}.hero p{font-size:18px;line-height:1.7;max-width:690px;color:#e9ebe8}.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:700}.primary{background:var(--gold);color:#102019}.ghost{border:1px solid rgba(255,255,255,.55);color:white}.facts{display:flex;gap:44px;flex-wrap:wrap;margin-top:55px}.fact b{display:block;font:32px Georgia;color:var(--gold)}
section{padding:85px 28px}.wrap{max-width:1180px;margin:auto}.kicker{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:12px}.sectionTitle{font:46px Georgia;margin:10px 0 18px}.lede{max-width:780px;color:#5e6762;line-height:1.8}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}.card{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px rgba(20,40,30,.06)}.card h3{font:26px Georgia;margin:0 0 8px}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:260px;gap:12px;margin-top:35px}.gallery img{width:100%;height:100%;object-fit:cover;border-radius:14px}.gallery img:first-child{grid-row:span 2}.location{background:var(--forest);color:white}.location .lede{color:#d4dbd7}.cta{background:#eadfca;text-align:center}.cta h2{font:48px Georgia;margin:0 0 12px}.chatWrap{max-width:500px;margin:35px auto 0;background:white;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.15)}.chatWrap iframe{width:100%;height:570px;border:0}footer{text-align:center;padding:28px;color:#758079}
@media(max-width:800px){.features{grid-template-columns:1fr}.gallery{grid-template-columns:1fr;grid-auto-rows:220px}.gallery img:first-child{grid-row:auto}.heroInner{padding:50px 22px}.facts{gap:24px}.sectionTitle{font-size:36px}}
</style></head><body>
<div id="page"><div style="padding:80px;text-align:center">Loading Shire Villas…</div></div>
<script>
const origin=location.origin; const qs=new URLSearchParams(location.search); const slug=qs.get('campaign')||'main';
function e(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const r=await fetch(origin+'/marketing/pages/'+encodeURIComponent(slug)+'/public');if(!r.ok){document.getElementById('page').innerHTML='<div style="padding:80px;text-align:center">Campaign page not found.</div>';return}const p=await r.json(),c=p.config||{};document.title=c.seo_title||p.name;document.querySelector('meta[name=description]').content=c.seo_description||'';document.documentElement.style.setProperty('--hero',`url("${c.hero_image||''}")`);
const facts=(c.facts||[]).map(x=>`<div class="fact"><b>${e(x.value)}</b>${e(x.label)}</div>`).join('');const feats=(c.features||[]).map(x=>`<div class="card"><h3>${e(x.title)}</h3><p>${e(x.text)}</p></div>`).join('');const gal=(c.gallery||[]).filter(Boolean).map(u=>`<img loading="lazy" src="${e(u)}" alt="Shire Villas">`).join('');
document.getElementById('page').innerHTML=`<header class="hero"><div class="heroInner"><div class="eyebrow">${e(c.eyebrow)}</div><h1>${e(c.headline)}</h1><p>${e(c.subheadline)}</p><div class="btns"><a class="btn primary" href="#enquire">${e(c.primary_cta)}</a>${c.brochure_url?`<a class="btn ghost" href="${e(c.brochure_url)}" target="_blank">View brochure</a>`:''}${c.video_url?`<a class="btn ghost" href="${e(c.video_url)}" target="_blank">Watch film</a>`:''}</div><div class="facts">${facts}</div></div></header><section><div class="wrap"><div class="kicker">THE PROJECT</div><h2 class="sectionTitle">${e(c.about_title)}</h2><p class="lede">${e(c.about_text)}</p><div class="features">${feats}</div>${gal?`<div class="gallery">${gal}</div>`:''}</div></section><section class="location"><div class="wrap"><div class="kicker">LOCATION</div><h2 class="sectionTitle">${e(c.location_title)}</h2><p class="lede">${e(c.location_text)}</p></div></section><section class="cta" id="enquire"><h2>${e(c.price_label||'Request current pricing')}</h2><p>Tell QBot what you are looking for. Your requirement will be qualified and passed to our sales team.</p><div class="chatWrap"><iframe src="/app/chatbot.html?campaign=${encodeURIComponent(slug)}"></iframe></div></section><footer>Shire Villas · Siolim, North Goa</footer>`;
}
load();
</script></body></html>
